[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
uvicorn = "^0.34.0"
fastapi = "^0.131.0"
python-multipart = "^0.0.5"
requests = "^2.28.0"
passlib = {extras = ["bcrypt"], version = "^1.7.2"}
bcrypt = "4.0.1"
tenacity = "^8.1.0"
pydantic = {extras = ["email"], version = "^2.10.6"}
pydantic-settings = "^2.8.0"
emails = "^0.5.15"
gunicorn = "^23.0.0"
jinja2 = "^2.11.2"
# Workaround jinja bug:
markupsafe = "2.0.1"
psycopg2-binary = "^2.8.5"
alembic = "^1.4.2"
sqlalchemy = "^1.4.50"
python-jose = {extras = ["cryptography"], version = "^3.1.0"}
rollbar = "^1.2.0"
zillion = "0.14.0"
orjson = "^3.3.0"
setuptools = "^80.0.0"

[tool.poetry.dev-dependencies]
mypy = "^1.15.0"
black = "^24.10.0"
isort = "^4.3.21"
autoflake = "^1.3.1"
flake8 = "^3.7.9"
pytest = "^8.3.5"
sqlalchemy-stubs = "^0.3"
pytest-cov = "^6.1.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

